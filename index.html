<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottoms Up - Spin Wheel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #2c3e50;
            color: white;
            margin: 0;
            padding: 20px;
        }
        #setup-screen, #game-screen {
            max-width: 600px;
            margin: 0 auto;
        }
        #game-screen {
            display: none;
        }
        canvas {
            background-color: #34495e;
            border-radius: 50%;
            margin-top: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            max-width: 100%;
        }
        input, button {
            padding: 10px;
            margin: 10px 5px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
        }
        button {
            background-color: #e74c3c;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #c0392b;
        }
        #pointer {
            font-size: 30px;
            margin-bottom: -15px;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Lobby Setup Screen -->
    <div id="setup-screen">
        <h1>Bottoms Up!</h1>
        <p>Enter your initials to join the game.</p>
        <input type="text" id="username" placeholder="Your Initials (e.g. NE)" maxlength="3">
        <br>
        <button id="join-btn">Join Game</button>
        <button id="start-btn" style="display:none;">Start Game (Host)</button>
        <div id="player-list">
            <h3>Players in Lobby:</h3>
            <ul id="players" style="list-style:none; padding:0;"></ul>
        </div>
    </div>

    <!-- Main Game Screen -->
    <div id="game-screen">
        <h1>Whose turn is it?</h1>
        <h2 id="turn-indicator">Waiting for players...</h2>
        <div id="pointer">▼</div>
        <canvas id="wheelCanvas" width="300" height="300"></canvas>
        <br>
        <button id="spin-btn">Spin the Wheel!</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
